<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rabbit Run Todo List</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --subtext-color: #aaaaaa;
      --border-color: #eeeeee;
      --input-border: #dddddd;
      --primary-color: #4a90e2;
      --primary-hover: #357abd;
      --delete-btn: #ff4d4f;
      --item-hover: #f9f9f9;
      --shadow-color: rgba(0, 0, 0, 0.1);
      --drag-handle: #888888;
      --dragging-bg: #eef5fc;
      --track-bg: #e0e0e0;
      --font-family: 'Noto Sans KR', sans-serif;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --subtext-color: #777777;
      --border-color: #2c2c2c;
      --input-border: #3c3c3c;
      --primary-color: #5c9ce6;
      --primary-hover: #4a80c2;
      --delete-btn: #ff6b6b;
      --item-hover: #262626;
      --shadow-color: rgba(0, 0, 0, 0.5);
      --drag-handle: #aaaaaa;
      --dragging-bg: #2a3848;
      --track-bg: #3c3c3c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .todo-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 440px;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 8px 24px var(--shadow-color);
      position: relative;
    }

    /* 달리기 트랙 디자인 */
    .track-section {
      margin-bottom: 24px;
      padding: 16px;
      background-color: var(--item-hover);
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .track-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--subtext-color);
      margin-bottom: 8px;
      font-weight: bold;
    }

    .track-container {
      position: relative;
      height: 36px;
      background-color: var(--track-bg);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 0 10px;
    }

    .rabbit-character {
      position: absolute;
      left: 0%;
      font-size: 22px;
      transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 2;
    }

    .goal-post {
      position: absolute;
      right: 10px;
      font-size: 20px;
      z-index: 1;
    }

    .progress-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background-color: rgba(74, 144, 226, 0.3);
      transition: width 0.4s ease-out;
      border-radius: 18px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      background: none;
      border: 1px solid var(--input-border);
      color: var(--text-color);
      border-radius: 20px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: inherit;
    }

    .icon-btn:hover {
      background-color: var(--item-hover);
    }

    .settings-panel {
      display: none;
      background-color: var(--item-hover);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
      flex-direction: column;
      gap: 12px;
      animation: fadeIn 0.3s ease-out;
    }

    .settings-panel.active {
      display: flex;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .setting-item label {
      font-weight: 600;
    }

    .setting-item input[type="color"] {
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    .setting-item select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--input-border);
      background-color: var(--card-bg);
      color: var(--text-color);
      outline: none;
      font-family: inherit;
      font-size: 13px;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .input-group input {
      flex: 1;
      padding: 12px 14px;
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }

    .input-group input:focus {
      border-color: var(--primary-color);
    }

    .input-group button {
      padding: 12px 18px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
    }

    .input-group button:hover {
      background-color: var(--primary-hover);
    }

    .congrats-message {
      display: none;
      text-align: center;
      padding: 12px;
      margin-bottom: 16px;
      background-color: rgba(74, 144, 226, 0.12);
      border-radius: 8px;
      color: var(--primary-color);
      font-weight: bold;
      font-size: 14px;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .todo-list {
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      padding: 10px 8px;
      border-bottom: 1px solid var(--border-color);
      border-radius: 6px;
      gap: 8px;
      background-color: var(--card-bg);
    }

    .todo-item:hover {
      background-color: var(--item-hover);
    }

    .todo-item:last-child {
      border-bottom: none;
    }

    .todo-item.dragging {
      opacity: 0.5;
      background-color: var(--dragging-bg);
    }

    .drag-handle {
      cursor: grab;
      color: var(--drag-handle);
      font-size: 14px;
      user-select: none;
      padding: 2px 4px;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .todo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--primary-color);
    }

    .todo-text {
      font-size: 15px;
      color: var(--text-color);
      flex: 1;
      word-break: break-all;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: var(--subtext-color);
    }

    .order-btns {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .arrow-btn {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 10px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 3px;
      line-height: 1;
      opacity: 0.6;
    }

    .arrow-btn:hover {
      opacity: 1;
      background-color: var(--input-border);
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--delete-btn);
      font-size: 16px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
      opacity: 0.7;
    }

    .delete-btn:hover {
      opacity: 1;
      background-color: rgba(255, 77, 79, 0.1);
    }
  </style>
</head>
<body>

  <div class="todo-container">
    <div class="track-section" id="trackSection">
      <div class="track-header">
        <span>🏃 Rabbit Run (달성률)</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="track-container">
        <div class="progress-bar-fill" id="progressBarFill"></div>
        <div class="rabbit-character" id="rabbitCharacter">🐇</div>
        <div class="goal-post">🏁</div>
      </div>
    </div>

    <div class="header">
      <h1>📝 Todo List</h1>
      <div class="header-actions">
        <button class="icon-btn" id="settingsToggleBtn" title="설정">
          ⚙️ <span>설정</span>
        </button>
        <button class="icon-btn" id="themeToggleBtn">
          <span id="themeIcon">🌙</span> <span id="themeText">다크</span>
        </button>
      </div>
    </div>

    <div class="settings-panel" id="settingsPanel">
      <div class="setting-item">
        <label for="bgColorPicker">🎨 배경색 지정</label>
        <input type="color" id="bgColorPicker" value="#f4f6f8" />
      </div>
      <div class="setting-item">
        <label for="fontSelect">🔤 폰트 선택</label>
        <select id="fontSelect">
          <option value="'Noto Sans KR', sans-serif">노토 산스 (기본 고딕)</option>
          <option value="'Nanum Gothic', sans-serif">나눔고딕</option>
          <option value="'Nanum Myeongjo', serif">나눔명조</option>
          <option value="'Gaegu', cursive">개구체 (손글씨)</option>
        </select>
      </div>
    </div>
    
    <div class="input-group">
      <input type="text" id="todoInput" placeholder="할 일을 입력하세요..." />
      <button id="addBtn">추가</button>
    </div>

    <div class="congrats-message" id="congratsMessage">
      🎉 축하합니다! 모든 골인을 달성했습니다! 🏁
    </div>

    <ul class="todo-list" id="todoList"></ul>
  </div>

  <script>
    const todoInput = document.getElementById('todoInput');
    const addBtn = document.getElementById('addBtn');
    const todoList = document.getElementById('todoList');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');
    const congratsMessage = document.getElementById('congratsMessage');

    const settingsToggleBtn = document.getElementById('settingsToggleBtn');
    const settingsPanel = document.getElementById('settingsPanel');
    const bgColorPicker = document.getElementById('bgColorPicker');
    const fontSelect = document.getElementById('fontSelect');

    const rabbitCharacter = document.getElementById('rabbitCharacter');
    const progressBarFill = document.getElementById('progressBarFill');
    const progressPercent = document.getElementById('progressPercent');

    // 1. 설정 토글
    settingsToggleBtn.addEventListener('click', () => {
      settingsPanel.classList.toggle('active');
    });

    bgColorPicker.addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--bg-color', e.target.value);
    });

    fontSelect.addEventListener('change', (e) => {
      document.documentElement.style.setProperty('--font-family', e.target.value);
    });

    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      if (currentTheme === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        themeIcon.textContent = '🌙';
        themeText.textContent = '다크';
        bgColorPicker.value = '#f4f6f8';
        document.documentElement.style.removeProperty('--bg-color');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeIcon.textContent = '☀️';
        themeText.textContent = '라이트';
        bgColorPicker.value = '#121212';
        document.documentElement.style.removeProperty('--bg-color');
      }
    });

    function triggerFireworks() {
      const duration = 2.5 * 1000;
      const animationEnd = Date.now() + duration;

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);

        const particleCount = 50 * (timeLeft / duration);
        confetti({
          particleCount: particleCount,
          spread: 70,
          origin: { x: 0.1, y: 0.8 },
          colors: ['#ff4d4f', '#4a90e2', '#52c41a', '#faad14', '#722ed1']
        });
        confetti({
          particleCount: particleCount,
          spread: 70,
          origin: { x: 0.9, y: 0.8 },
          colors: ['#ff4d4f', '#4a90e2', '#52c41a', '#faad14', '#722ed1']
        });
      }, 250);
    }

    // 2. 달리기 트랙 업데이트 핵심 로직
    function updateProgress() {
      const items = todoList.querySelectorAll('.todo-item');
      if (items.length === 0) {
        progressPercent.textContent = '0%';
        progressBarFill.style.width = '0%';
        rabbitCharacter.style.left = '0%';
        congratsMessage.style.display = 'none';
        return;
      }

      const completedItems = todoList.querySelectorAll('.todo-item.completed');
      const percent = Math.round((completedItems.length / items.length) * 100);

      progressPercent.textContent = `${percent}%`;
      progressBarFill.style.width = `${percent}%`;

      // 토끼 위치 이동 (최대 88% 지점까지 이동)
      const rabbitPos = (percent / 100) * 88;
      rabbitCharacter.style.left = `${rabbitPos}%`;

      if (items.length > 0 && items.length === completedItems.length) {
        congratsMessage.style.display = 'block';
        triggerFireworks();
      } else {
        congratsMessage.style.display = 'none';
      }
    }

    // 3. 드래그앤드롭
    todoList.addEventListener('dragover', (e) => {
      e.preventDefault();
      const draggingItem = document.querySelector('.dragging');
      if (!draggingItem) return;

      const siblings = [...todoList.querySelectorAll('.todo-item:not(.dragging)')];
      const nextSibling = siblings.find(sibling => {
        return e.clientY <= sibling.getBoundingClientRect().top + sibling.offsetHeight / 2;
      });

      todoList.insertBefore(draggingItem, nextSibling);
    });

    // 4. 할 일 추가
    function addTodo() {
      const text = todoInput.value.trim();
      if (text === '') {
        alert('할 일을 입력해 주세요!');
        return;
      }

      const li = document.createElement('li');
      li.className = 'todo-item';
      li.draggable = true;

      li.addEventListener('dragstart', () => {
        li.classList.add('dragging');
      });

      li.addEventListener('dragend', () => {
        li.classList.remove('dragging');
      });

      const dragHandle = document.createElement('span');
      dragHandle.className = 'drag-handle';
      dragHandle.innerHTML = '⋮⋮';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.addEventListener('change', function () {
        li.classList.toggle('completed', checkbox.checked);
        updateProgress();
      });

      const span = document.createElement('span');
      span.className = 'todo-text';
      span.textContent = text;

      const orderBtns = document.createElement('div');
      orderBtns.className = 'order-btns';

      const upBtn = document.createElement('button');
      upBtn.className = 'arrow-btn';
      upBtn.innerHTML = '▲';
      upBtn.addEventListener('click', () => {
        const prevLi = li.previousElementSibling;
        if (prevLi) {
          todoList.insertBefore(li, prevLi);
        }
      });

      const downBtn = document.createElement('button');
      downBtn.className = 'arrow-btn';
      downBtn.innerHTML = '▼';
      downBtn.addEventListener('click', () => {
        const nextLi = li.nextElementSibling;
        if (nextLi) {
          todoList.insertBefore(nextLi, li);
        }
      });

      orderBtns.appendChild(upBtn);
      orderBtns.appendChild(downBtn);

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.innerHTML = '🗑️';
      deleteBtn.addEventListener('click', function () {
        li.remove();
        updateProgress();
      });

      li.appendChild(dragHandle);
      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(orderBtns);
      li.appendChild(deleteBtn);

      todoList.appendChild(li);

      todoInput.value = '';
      todoInput.focus();

      updateProgress();
    }

    addBtn.addEventListener('click', addTodo);
    todoInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        addTodo();
      }
    });
  </script>

</body>
</html>
