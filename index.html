<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rabbit Run Todo List</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --subtext-color: #aaaaaa;
      --border-color: #eeeeee;
      --input-border: #dddddd;
      --primary-color: #4a90e2;
      --primary-hover: #357abd;
      --delete-btn: #ff4d4f;
      --item-hover: #f9f9f9;
      --shadow-color: rgba(0, 0, 0, 0.1);
      --drag-handle: #888888;
      --dragging-bg: #eef5fc;
      --track-bg: #e0e0e0;
      --font-family: 'Noto Sans KR', sans-serif;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --subtext-color: #777777;
      --border-color: #2c2c2c;
      --input-border: #3c3c3c;
      --primary-color: #5c9ce6;
      --primary-hover: #4a80c2;
      --delete-btn: #ff6b6b;
      --item-hover: #262626;
      --shadow-color: rgba(0, 0, 0, 0.5);
      --drag-handle: #aaaaaa;
      --dragging-bg: #2a3848;
      --track-bg: #3c3c3c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .todo-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 440px;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 8px 24px var(--shadow-color);
      position: relative;
    }

    /* 달리기 트랙 디자인 */
    .track-section {
      margin-bottom: 24px;
      padding: 16px;
      background-color: var(--item-hover);
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .track-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--subtext-color);
      margin-bottom: 8px;
      font-weight: bold;
    }

    .track-container {
      position: relative;
      height: 36px;
      background-color: var(--track-bg);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 0 10px;
    }

    .rabbit-character {
      position: absolute;
      left: 0%;
      font-size: 22px;
      transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 2;
    }

    .goal-post {
      position: absolute;
      right: 10px;
      font-size: 20px;
      z-index: 1;
    }

    .progress-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background-color: rgba(74, 144, 226, 0.3);
      transition: width 0.4s ease-out;
      border-radius: 18px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      background: none;
      border: 1px solid var(--input-border);
      color: var(--text-color);
      border-radius: 20px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: inherit;
    }

    .icon-btn:hover {
      background-color: var(--item-hover);
    }

    .settings-panel {
      display: none;
      background-color: var(--item-hover);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
      flex-direction: column;
      gap: 12px;
      animation: fadeIn 0.3s ease-out;
    }

    .settings-panel.active {
      display: flex;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .setting-item label {
      font-weight: 600;
    }
